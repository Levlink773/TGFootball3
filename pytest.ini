[pytest]
asyncio_mode = auto
# one event loop for the whole session — the async DB engine binds to the loop it
# is first used on, so per-test loops break every test after the first.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
testpaths = tests
pythonpath = . tests
addopts = -q --tb=short
