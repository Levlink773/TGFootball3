# TG Football Mini App — subdomain vhost DRAFT (do not enable without explicit go)
# Assumed subdomain: app.football-blitz.online — CONFIRM with Maxim before certbot.
#
# Setup on VPS:
#   1. DNS A record: app.football-blitz.online -> 46.202.190.222
#   2. certbot --nginx -d app.football-blitz.online
#   3. rsync webapp/dist/ -> /root/footballgame/webapp/dist/
#   4. cp this file /etc/nginx/sites-available/tgfootball-app.conf && ln -s ... sites-enabled/
#   5. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name app.football-blitz.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.football-blitz.online;

    ssl_certificate /etc/letsencrypt/live/app.football-blitz.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.football-blitz.online/privkey.pem;

    # Mini App API sidecar (uvicorn, systemd unit footballgame-api)
    location /api/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React static build
    root /root/footballgame/webapp/dist;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # cache immutable hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
