# TG Football Mini App — subdomain vhost DRAFT (do not enable without explicit go)
# Assumed subdomain: app.football-blitz.online — CONFIRM with Maxim before certbot.
#
# Setup on VPS:
#   1. DNS A record: app.football-blitz.online -> 46.202.190.222
#   2. certbot --nginx -d app.football-blitz.online
#   3. rsync webapp/dist/ -> /root/footballgame/webapp/dist/
#   4. cp this file /etc/nginx/sites-available/tgfootball-app.conf && ln -s ... sites-enabled/
#   5. nginx -t && systemctl reload nginx
#
# RATE LIMITING: the three limit_*_zone directives below must live in the http{}
# block of /etc/nginx/nginx.conf, NOT in this vhost:
#
#   limit_req_zone  $binary_remote_addr zone=tgfapi:10m     rate=10r/s;
#   limit_req_zone  $binary_remote_addr zone=tgfinvoice:10m rate=6r/m;
#   limit_conn_zone $binary_remote_addr zone=tgfconn:10m;
#
# Limits are deliberately loose: Ukrainian mobile carriers put many subscribers
# behind one CGNAT address, so a per-IP bucket is shared. Do not tighten without
# measuring real traffic first.

server {
    listen 80;
    server_name app.football-blitz.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.football-blitz.online;

    ssl_certificate /etc/letsencrypt/live/app.football-blitz.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.football-blitz.online/privkey.pem;

    # Invoice creation calls out to Monobank and writes rows — tightest bucket.
    # Exact-match location wins over the /api/ prefix below.
    location = /api/shop/invoice {
        limit_req zone=tgfinvoice burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mini App API sidecar (uvicorn, systemd unit footballgame-api).
    # The DB pool is 10+20; without a limiter a modest burst exhausts it and 500s
    # the whole API.
    location /api/ {
        limit_req  zone=tgfapi burst=20 nodelay;
        limit_conn tgfconn 10;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React static build
    root /root/footballgame/webapp/dist;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # cache immutable hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
